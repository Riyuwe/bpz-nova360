<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="80" fill="#6D28D9"/>

  <!-- Subtle accent arc (lighter purple) behind the N -->
  <path d="M 140 310 Q 256 100 372 310" stroke="#A78BFA" stroke-width="18" stroke-linecap="round" fill="none" opacity="0.55"/>

  <!-- Neural node dots on the arc -->
  <circle cx="140" cy="310" r="14" fill="#A78BFA" opacity="0.75"/>
  <circle cx="256" cy="155" r="10" fill="#A78BFA" opacity="0.65"/>
  <circle cx="372" cy="310" r="14" fill="#A78BFA" opacity="0.75"/>

  <!-- Small spark/node at apex -->
